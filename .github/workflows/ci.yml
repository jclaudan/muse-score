name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: node --check desktop/main.js
      - run: node --check desktop/preload.js
      - run: node --check scripts/download-musescore.mjs
      - run: npm run build
