services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      MUSESCORE_BIN: /usr/local/bin/mscore-wrapper
      QT_QPA_PLATFORM: offscreen
      DATA_DIR: /app/data
      SOUNDSLICE_APP_ID: ${SOUNDSLICE_APP_ID:-}
      SOUNDSLICE_PASSWORD: ${SOUNDSLICE_PASSWORD:-}
    volumes:
      - ./data:/app/data
